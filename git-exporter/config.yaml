name: Home Assistant Git Exporter (patched)
version: "1.17.1-beennnn.13"
slug: git-exporter
description: Export all of your HA config to a git repo (Beennnn patched fork — check_secrets fix, Poeschl PR #6, AI-generated commit messages PR #14, + skip-when-deploy-pending anti-race)
url: https://github.com/Beennnn/git-exporter
arch:
  - aarch64
  - amd64
startup: once
boot: manual
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - config
options:
  repository:
    url: ''
    username: ''
    password: ''
    pull_before_push: true
    commit_message: Home Assistant Git Exporter
    commit_message_prompt: ''
    commit_message_api_key: ''
    commit_message_model: claude-haiku-4-5-20251001
    commit_message_timeout: 10
    branch_name: main
    skip_when_deploy_pending: false
    deployed_sha_entity: input_text.ha_deployed_sha
    merged_branch: ''
    deployed_subdir: config
    fail_closed_when_marker_unreadable: false
    status_entity: input_text.ha_exporter_last_result
    deployed_sha_read_attempts: 12
    deployed_sha_read_delay: 5
  export:
    lovelace: true
    addons: true
    esphome: true
    node_red: true
  check:
    enabled: true
    check_for_secrets: true
    check_for_ips: true
  exclude:
    - '*.db'
    - '*.log*'
    - __pycache__
    - ._*
    - .DS_Store
    - deps/
    - known_devices.yaml
    - tts/
    - '*.db-shm'
    - '*.db-wal'
    - '*.gz'
  secrets: []
  allowed_secrets: []
  dry_run: false
schema:
  repository:
    url: match(https://.*)
    email: match(.+@.+)?
    username: str
    password: password
    pull_before_push: bool
    commit_message: str
    commit_message_prompt: str?
    commit_message_api_key: password?
    commit_message_model: str?
    commit_message_timeout: int?
    branch_name: str
    skip_when_deploy_pending: bool?
    deployed_sha_entity: str?
    merged_branch: str?
    deployed_subdir: str?
    fail_closed_when_marker_unreadable: bool?
    status_entity: str?
    deployed_sha_read_attempts: int?
    deployed_sha_read_delay: int?
    ssl_verification: bool?
  export:
    lovelace: bool
    addons: bool
    esphome: bool
    node_red: bool
  check:
    enabled: bool
    check_for_secrets: bool
    check_for_ips: bool
  exclude:
    - str
  secrets:
    - str
  allowed_secrets:
    - str
  dry_run: bool
